    <div class="volume-container">
      <button id="playBtn">▶️</button>
      <button id="muteBtn">🔊</button>
      
      <span>0</span>
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
        id="volumeSlider"
      />
      <span>100</span>
    </div>

    <audio id="audio" src="opening-track.mp3" loop></audio>

<script>
  window.POKEDEX_GENERATION = "all";
</script>
<script src="page-generation.js"></script>
<script>
  const audio = document.getElementById("audio");
  const slider = document.getElementById("volumeSlider");
  const muteBtn = document.getElementById("muteBtn");
  const playBtn = document.getElementById("playBtn");
  const volumeContainer = document.querySelector(".volume-container");

  // VOLUME
  slider.addEventListener("input", function () {
    audio.volume = this.value;
  });

  // PLAY / PAUSE
  playBtn.addEventListener("click", function () {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = "⏸️";
    } else {
      audio.pause();
      playBtn.textContent = "▶️";
    }
  });

  // MUTE
  muteBtn.addEventListener("click", function () {
    audio.muted = !audio.muted;
    muteBtn.textContent = audio.muted ? "🔇" : "🔊";
  });

  // DRAG & DROP
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  volumeContainer.addEventListener("mousedown", (e) => {
    isDragging = true;

    volumeContainer.classList.add("dragging");
    document.body.classList.add("dragging");

    offsetX = e.clientX - volumeContainer.offsetLeft;
    offsetY = e.clientY - volumeContainer.offsetTop;
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    volumeContainer.style.left = (e.clientX - offsetX) + "px";
    volumeContainer.style.top = (e.clientY - offsetY) + "px";

    volumeContainer.style.right = "auto";
    volumeContainer.style.bottom = "auto";
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;

    volumeContainer.classList.remove("dragging");
    document.body.classList.remove("dragging");
  });
</script>

  </body>
